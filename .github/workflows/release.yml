name: Release

# Push a tag like v2.1.0 (or run this by hand from the Actions tab) to build Maestro-win-x64.exe
# and publish it as a GitHub release. install.ps1 downloads from the newest release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag to create, e.g. v2.1.0
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build
        shell: pwsh
        run: |
          $tag = '${{ github.event.inputs.tag || github.ref_name }}'
          $version = $tag -replace '^v\.?', '' # v1.2.3 or v.1.2.3 -> 1.2.3
          if ($version -notmatch '^\d+(\.\d+){1,3}$') { throw "Tag '$tag' isn't a version like v1.2.3" }
          dotnet publish src/Maestro -c Release -o out "-p:Version=$version"
          Move-Item out/Maestro.exe out/Maestro-win-x64.exe

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.event.inputs.tag || github.ref_name }}'
          # Creating a release on GitHub's Releases page also pushes its tag (which runs this): then just attach the exe.
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag out/Maestro-win-x64.exe --clobber
          } else {
            gh release create $tag out/Maestro-win-x64.exe --target '${{ github.sha }}' --title "Maestro $tag" --generate-notes
          }
